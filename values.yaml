# Default values for varroa
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


conf:
  transport_url:
  keystone:
    auth_url:
    username: varroa
    project_name: service
    service_name: security
    endpoint_id:
    region_name:
    memcached_servers: []
  oslo_messaging_rabbit:
    ssl: true
  database:
    connection:
  sentry:
    environment: production
vault:
  role: k8s
  settings_secret: 'path/to/secret/in/vault'

api:
  port: 5000
  apache:
    enabled: false
  image:
    repository: registry.rc.nectar.org.au/nectar/varroa
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  gateway:
    enabled: false
    annotations: {}
    hostname: chart-example.local
    parentRefs:
      - name: default

metric:
  name: metric
  port: 9001
  apache:
    enabled: false
  image:
    repository: registry.rc.nectar.org.au/nectar/varroa
  healthchecks: false
  command:
    - gunicorn
    - "--bind"
    - "0.0.0.0:9001"
    - "--access-logfile=-"
    - "--worker-tmp-dir"
    - "/dev/shm"
    - "--workers"
    - "2"
    - "varroa.wsgi_metric:application"
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  gateway:
    enabled: false

notification:
  name: notification
  image:
    repository: registry.rc.nectar.org.au/nectar/varroa
  command:
    - varroa-notification
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
  # varroa-notification runs a notification listener, not an RPC
  # server, so oslo.messaging's RPC ping endpoint is not available.
  # Instead check the pod holds an ESTABLISHED TCP connection to the
  # transport_url port, which catches a cotyledon service manager that
  # is running but spawned no consumer at all. Startup-only on
  # purpose: a liveness probe on the message bus would mass-restart
  # every worker during a RabbitMQ outage that oslo.messaging would
  # ride out by reconnecting; post-start wedges are left to
  # queue/consumer alerting. Requires nectarlib >= 4.4.0 to render.
  startupProbe:
    exec:
      command:
        - nectar-health-probe
        - "--project"
        - varroa
        - amqp
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

worker:
  image:
    repository: registry.rc.nectar.org.au/nectar/varroa
  command:
    - varroa-worker
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
  # Probe the worker's own RPC server via oslo.messaging's built-in
  # ping endpoint (rpc_ping_enabled=true is set in varroa.conf). The
  # probe targets the per-host queue varroa-worker.<pod hostname>, so
  # it proves this pod's worker is consuming and dispatching messages,
  # catching a cotyledon service manager that is running but spawned
  # no workers. Startup-only on purpose: a liveness probe on the
  # message bus would mass-restart every worker during a RabbitMQ
  # outage that oslo.messaging would ride out by reconnecting;
  # post-start wedges are left to queue/consumer alerting.
  # Requires nectarlib >= 4.4.0 to render.
  startupProbe:
    exec:
      command:
        - nectar-health-probe
        - "--project"
        - varroa
        - rpc-ping
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30


metrics:
  enabled: true
  serviceMonitor:
    enabled: true


job:
  db_sync:
    enabled: true
    command:
      - varroa-manage
      - db
      - upgrade

oslo_policy:

image:
  repository: registry.rc.nectar.org.au/nectar/varroa
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 42420
  runAsGroup: 42420
  fsGroup: 42420
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  port: 80


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

components:
  mariadb: false
  rabbitmq: false
  memcached: false
